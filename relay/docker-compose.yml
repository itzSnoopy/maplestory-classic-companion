services:
  party-relay:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # comma list of allowed party codes; leave empty to accept any 6-64 character code
      PARTY_CODES: ""
      # players per code; 0 = no limit (a hangout of any size)
      MAX_MEMBERS: "0"
      # skill feedback inbox: owner key (empty = feedback disabled), optional comma list of codes
      FEEDBACK_KEY: ""
      FEEDBACK_CODES: ""
