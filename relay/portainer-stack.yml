# Portainer: Stacks > Add stack > Web editor, paste this whole file, Deploy.
# Generated from party_relay.py by make_stack.py (run it again after changing the relay).
services:
  party-relay:
    image: python:3.12-slim
    restart: unless-stopped
    user: nobody
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      # comma list of allowed party codes; empty = any 6-64 character code
      PARTY_CODES: ""
      # players per code; 0 = no limit (a hangout of any size)
      MAX_MEMBERS: "0"
      # skill feedback inbox: owner key (empty = feedback disabled), optional comma list of codes
      FEEDBACK_KEY: ""
      FEEDBACK_CODES: ""
      RELAY_CODE: |
        """party_relay.py - the tiny server trackers use to see each other's numbers.

        Each tracker posts its own state (name, level, EXP %, EXP/hr, HP, MP, map) every few seconds
        under a shared party code, and gets back everyone else's under that code. A code is a group: an
        in-game party, or a hangout of friends spread over any maps, with no player limit. Nothing is written to
        disk: members drop out 90 s after their last update, and a restart forgets everything.

        It also has a small "skill feedback" inbox (off unless FEEDBACK_KEY is set): friends send a skill
        review export, the owner fetches it with a key. Also memory only; a restart forgets it.

        Challenges (friendly timed kill races between members of one code, memory only): a member creates
        one for a name / everyone on their map / everyone, invitees accept, the relay clock starts it 5 s later,
        every client sends its kills (on its normal party post under "ch", or on the challenge path) and the relay
        keeps the score and decides the winner (or a tie).
          POST /v1/challenge/<code>        {"name", "mode": "1v1"|"map"|"all", "minutes": 2|5|10|15, "target"?} -> challenge
          POST /v1/challenge/<code>/<id>   {"name", "action": "accept"|"decline"|"cancel"|"kills", "kills"?: [{"s","n","t"?}]}
          GET  /v1/challenge/<code>/<id>   -> challenge
        A party post may carry "ch": {"id", "kills": [{"s": seq, "n": 1..4, "t": server-clock time}]}; its reply gets
        "challenges": [...] (the ones you are in or invited to) with your acknowledged "ack" seq.

        Python 3.8+, standard library only.

          PORT=8787 python3 party_relay.py

        Environment:
          PORT          listen port (default 8787)
          BIND          listen address (default 0.0.0.0)
          PARTY_CODES   optional comma list of allowed party codes; empty = any code of 6-64 chars
                        (set it on a public server so strangers can't use yours)
          MAX_MEMBERS   players per code; 0 (default) = no limit
          FEEDBACK_KEY  owner key for the feedback inbox; EMPTY (default) = feedback endpoints disabled (404)
          FEEDBACK_CODES  optional comma list of allowed feedback codes; empty = any code of 6-64 chars
          FEEDBACK_TTL_DAYS  days an item is kept (default 30)
          FEEDBACK_MAX  items kept in total across codes (default 300; when full the oldest is dropped)

        API (JSON):
          POST /v1/party/<code>   body {"name": ..., <fields>}  -> {"members": [...], "server_t": ...}
          GET  /v1/party/<code>                                  -> the same, without posting
          GET  /health   -> {"ok": true, "source": <repo url>, "feedback": <enabled>}
        Each member comes back as its fields + "name" + "age_s" (seconds since its last post).

        Feedback (needs FEEDBACK_KEY; body max 64 KB; one POST per 30 s per address):
          POST   /v1/feedback/<code>  body = a "classic-skill-review/1" export -> {"ok": true, "id": ...}
          GET    /v1/feedback/<code>  header X-Feedback-Key -> {"items": [...], "server_t": ...} oldest first
          DELETE /v1/feedback/<code>  header X-Feedback-Key, optional body {"ids": [...]} -> {"deleted": n}
        Only the cleaned review (reviewer nickname + answers) is kept; no addresses are stored or logged.
        Source (AGPLv3): https://github.com/itzSnoopy/maplestory-classic-companion
        """
        import hmac
        import json
        import os
        import re
        import secrets
        import threading
        import time
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        TTL_S = 90
        MAX_BODY = 4096
        FEEDBACK_MAX_BODY = 65536
        FEEDBACK_GAP_S = 30     # min seconds between feedback posts from one address
        SOURCE_URL = "https://github.com/itzSnoopy/maplestory-classic-companion"
        MAX_REPLY = 2000        # members returned per answer (keeps big hangouts' replies sane)
        MAX_MEMBERS = int(os.environ.get("MAX_MEMBERS", "0"))     # 0 = no limit
        MAX_CODES = 500
        RATE_PER_S = 4          # requests per second per address (burst 10)
        CODE_RE = re.compile(r"^[A-Za-z0-9_-]{6,64}$$")
        NAME_RE = re.compile(r"^[A-Za-z0-9]{1,16}$$")
        # what a member may send: field -> check
        FIELDS = {
            "level": lambda v: isinstance(v, int) and 0 < v < 300,
            "job": lambda v: isinstance(v, str) and len(v) <= 32,
            "map": lambda v: isinstance(v, str) and len(v) <= 64,
            "state": lambda v: v in ("playing", "idle", "waiting_for_source", "stopped"),
            "exp_cur": lambda v: isinstance(v, int) and v >= 0,
            "exp_need": lambda v: isinstance(v, int) and v >= 0,
            "exp_pct": lambda v: isinstance(v, (int, float)) and 0 <= v <= 100,
            "exp_hr": lambda v: isinstance(v, (int, float)) and v >= 0,
            "eta": lambda v: isinstance(v, str) and len(v) <= 16,
            "hp": lambda v: _pair(v),
            "mp": lambda v: _pair(v),
            "channel": lambda v: isinstance(v, (int, str)) and len(str(v)) <= 4,
            "v": lambda v: isinstance(v, str) and len(v) <= 16,
            "caps": lambda v: isinstance(v, str) and len(v) <= 32 and re.match(r"^[a-z0-9,]*$$", v),
        }

        # challenges (memory only; they last minutes)
        CH_MODES = ("1v1", "map", "all")
        CH_MINUTES = (2, 5, 10, 15)
        CH_PENDING_S = 60       # an invitation nobody accepted expires
        CH_COUNTDOWN_S = 5      # accept -> start
        CH_GRACE_S = 4          # kill events that arrive this long after the end still count (if stamped before it)
        CH_KEEP_S = 300         # finished challenges are forgotten after this
        CH_SHOW_RESULT_S = 120  # a result stays in the replies this long
        CH_MAX = 20             # per code
        CH_MAX_KPS = 1.5        # kills per second a player can plausibly make (90/min); more is dropped
        CH_MAX_N = 4            # kills in one event
        CH_MAX_EVENTS = 20      # events in one post
        challenges = {}         # code -> {id: challenge}


        def _pair(v):
            return (isinstance(v, list) and len(v) == 2 and all(isinstance(x, int) and 0 <= x < 10 ** 6
                                                                 for x in v))


        FEEDBACK_KEY = os.environ.get("FEEDBACK_KEY", "")       # empty = feedback disabled
        FEEDBACK_CODES = {c.strip() for c in os.environ.get("FEEDBACK_CODES", "").split(",") if c.strip()}
        FEEDBACK_TTL_DAYS = float(os.environ.get("FEEDBACK_TTL_DAYS", "30") or 30)
        FEEDBACK_MAX = int(os.environ.get("FEEDBACK_MAX", "300") or 300)
        FEEDBACK_FORMAT = "classic-skill-review/1"
        feedback = []           # [(code, item)] oldest first
        fb_last = {}            # address -> time of last feedback post
        BRANCH_RE = re.compile(r"^[A-Za-z0-9 ]{1,32}$$")
        SKILL_ID_RE = re.compile(r"^\d{1,9}$$")
        CTRL_RE = re.compile(r"[\x00-\x1f\x7f]")
        STATUSES = ("ok", "wrong", "unsure", "")
        KINDS = ("", "attack", "buff", "passive", "other")
        MODES = ("", "timed", "toggle", "until death")

        ALLOWED = {c.strip() for c in os.environ.get("PARTY_CODES", "").split(",") if c.strip()}
        parties = {}            # code -> {name: (t, fields)}
        buckets = {}            # address -> (tokens, t)
        lock = threading.Lock()


        def _rate_ok(addr):
            now = time.time()
            tok, t = buckets.get(addr, (10.0, now))
            tok = min(10.0, tok + (now - t) * RATE_PER_S)
            if tok < 1:
                buckets[addr] = (tok, now)
                return False
            buckets[addr] = (tok - 1, now)
            if len(buckets) > 5000:
                buckets.clear()
            return True


        def _members(code, now):
            p = parties.get(code) or {}
            for n in [n for n, (t, _) in p.items() if now - t > TTL_S]:
                del p[n]
            if not p:
                parties.pop(code, None)
            out = sorted(p.items(), key=lambda kv: -kv[1][0])[:MAX_REPLY]       # freshest first
            return [{**f, "name": n, "age_s": round(now - t, 1)} for n, (t, f) in out]


        class Invalid(Exception):
            pass


        class ChError(Exception):
            def __init__(self, code, msg):
                super().__init__(msg)
                self.code, self.msg = code, msg


        def _ch_tick(code, now):
            """Move this code's challenges along with the clock; forget old ones. Call under the lock."""
            chs = challenges.get(code)
            if not chs:
                challenges.pop(code, None)
                return {}
            for cid, c in list(chs.items()):
                if c["state"] == "open" and now - c["created_t"] > CH_PENDING_S:
                    c["state"], c["ended_t"] = "expired", now
                elif c["state"] == "running" and now > c["end_t"] + CH_GRACE_S:
                    ranking = sorted(({"name": n, "score": p["score"]} for n, p in c["players"].items()
                                      if p["accepted"]), key=lambda r: (-r["score"], r["name"]))
                    tie = len(ranking) > 1 and ranking[0]["score"] == ranking[1]["score"]
                    c["state"], c["ended_t"] = "done", now
                    c["result"] = {"ranking": ranking, "tie": tie, "winner": None if tie else ranking[0]["name"]}
                if c["state"] not in ("open", "running") and now - c["ended_t"] > CH_KEEP_S:
                    del chs[cid]
            if not chs:
                challenges.pop(code, None)
            return chs


        def _ch_busy(chs, name):
            return any(c["state"] in ("open", "running") and c["players"].get(name, {}).get("accepted")
                       for c in chs.values())


        def _ch_view(c, now):
            if c["state"] == "running":
                phase = "starting" if now < c["start_t"] else "live" if now <= c["end_t"] else "ending"
            else:
                phase = c["state"]
            out = {"id": c["id"], "type": "kills", "mode": c["mode"], "minutes": c["minutes"],
                   "creator": c["creator"], "state": c["state"], "phase": phase, "created_t": c["created_t"],
                   "invited": sorted(c["invited"]), "start_t": c.get("start_t"), "end_t": c.get("end_t"),
                   "players": [{"name": n, "score": p["score"], "accepted": p["accepted"], "ack": p["seq"]}
                               for n, p in c["players"].items()]}
            if c.get("result"):
                out["result"] = c["result"]
            return out


        def _ch_for(code, name, now):
            """The challenges a member is in or invited to (open, running, or finished a moment ago)."""
            out = []
            for c in _ch_tick(code, now).values():
                if name not in c["players"] and name not in c["invited"]:
                    continue
                if c["state"] in ("open", "running") or (c["state"] == "done"
                                                         and now - c["ended_t"] < CH_SHOW_RESULT_S):
                    out.append(_ch_view(c, now))
            return out


        def _ch_create(code, name, d, now):
            mode, minutes, target = d.get("mode"), d.get("minutes"), d.get("target")
            if mode not in CH_MODES or minutes not in CH_MINUTES or isinstance(minutes, bool):
                raise ChError(400, "bad mode or minutes")
            chs = _ch_tick(code, now)
            members = {n: f for n, (t, f) in (parties.get(code) or {}).items() if now - t <= TTL_S}
            if name not in members:
                raise ChError(409, "post your state first")
            if _ch_busy(chs, name):
                raise ChError(409, "you are already in a challenge")
            if sum(1 for c in chs.values() if c["state"] in ("open", "running")) >= CH_MAX:
                raise ChError(429, "too many challenges")
            if mode == "1v1":
                if not isinstance(target, str) or not NAME_RE.match(target) or target == name:
                    raise ChError(400, "bad target")
                if target not in members:
                    raise ChError(404, "target is not online")
                invited = {target}
            elif mode == "map":
                here = members[name].get("map")
                invited = {n for n, f in members.items() if n != name and here and f.get("map") == here}
            else:
                invited = {n for n in members if n != name}
            if not invited:
                raise ChError(409, "nobody to invite")
            c = {"id": secrets.token_hex(4), "mode": mode, "minutes": minutes, "creator": name,
                 "created_t": now, "state": "open", "invited": invited,
                 "players": {name: {"accepted": True, "score": 0, "seq": 0}}}
            challenges.setdefault(code, {})[c["id"]] = c
            return c


        def _ch_act(code, name, cid, d, now):
            chs = _ch_tick(code, now)
            c = chs.get(cid)
            if c is None:
                raise ChError(404, "no such challenge")
            action = d.get("action")
            if action == "accept":
                if name not in c["invited"] or c["state"] not in ("open", "running"):
                    raise ChError(409, "can't accept")
                if c["state"] == "running" and now >= c["start_t"]:
                    raise ChError(409, "already started")
                if _ch_busy(chs, name):
                    raise ChError(409, "you are already in a challenge")
                c["invited"].discard(name)
                c["players"][name] = {"accepted": True, "score": 0, "seq": 0}
                if c["state"] == "open":
                    c["state"] = "running"
                    c["start_t"] = now + CH_COUNTDOWN_S
                    c["end_t"] = c["start_t"] + c["minutes"] * 60
            elif action == "decline":
                if name not in c["invited"]:
                    raise ChError(409, "not invited")
                c["invited"].discard(name)
                if c["state"] == "open" and (c["mode"] == "1v1" or not c["invited"]):
                    c["state"], c["ended_t"] = "declined", now
            elif action == "cancel":
                if name != c["creator"] or c["state"] != "open":
                    raise ChError(409, "can't cancel")
                c["state"], c["ended_t"] = "cancelled", now
            elif action == "kills":
                _ch_kills(c, name, d.get("kills"), now)
            else:
                raise ChError(400, "bad action")
            return c


        def _ch_kills(c, name, events, now):
            """Count a player's kill events: [{"s": seq, "n": kills, "t": server-clock time}]. Events are
            acknowledged by seq (the client resends until "ack" catches up); what can't count (before the
            start, after the end, stamped outside it, faster than anyone can kill) is acknowledged and ignored."""
            p = c["players"].get(name)
            if p is None or c["state"] != "running" or not isinstance(events, list):
                return
            for e in events[:CH_MAX_EVENTS]:
                if not isinstance(e, dict):
                    continue
                s, n, t = e.get("s"), e.get("n"), e.get("t")
                if not isinstance(s, int) or isinstance(s, bool) or s <= p["seq"]:
                    continue
                p["seq"] = s
                if not isinstance(n, int) or isinstance(n, bool) or not 1 <= n <= CH_MAX_N:
                    continue
                if now < c["start_t"] - 1 or now > c["end_t"] + CH_GRACE_S:
                    continue
                stamp = t if isinstance(t, (int, float)) and not isinstance(t, bool) else now
                if stamp < c["start_t"] or stamp > c["end_t"]:
                    continue
                if p["score"] + n > (min(now, c["end_t"]) - c["start_t"]) * CH_MAX_KPS + CH_MAX_N:
                    continue
                p["score"] += n


        def _clean_submission(d):
            """Validate a review export; return the cleaned copy (unknown fields dropped) or raise Invalid."""
            if not isinstance(d, dict):
                raise Invalid("body must be an object")
            if d.get("format") != FEEDBACK_FORMAT:
                raise Invalid("unknown format")
            branch = d.get("branch")
            if not isinstance(branch, str) or not BRANCH_RE.match(branch):
                raise Invalid("bad branch")
            reviewer = d.get("reviewer", "")
            if not isinstance(reviewer, str):
                raise Invalid("bad reviewer")
            reviewer = reviewer.strip()
            if len(reviewer) > 24 or CTRL_RE.search(reviewer):
                raise Invalid("bad reviewer")
            exported = d.get("exported", "")
            if not isinstance(exported, str) or len(exported) > 40:
                raise Invalid("bad exported")
            out = {"format": FEEDBACK_FORMAT, "branch": branch, "reviewer": reviewer, "exported": exported}
            fetched = d.get("data_fetched")
            if fetched is not None:
                if not isinstance(fetched, str) or len(fetched) > 40:
                    raise Invalid("bad data_fetched")
                out["data_fetched"] = fetched
            cnt = d.get("count", 0)
            if isinstance(cnt, bool) or not isinstance(cnt, int) or not 0 <= cnt <= 1000:
                raise Invalid("bad count")
            rv = d.get("reviews")
            if not isinstance(rv, dict) or not 1 <= len(rv) <= 400:
                raise Invalid("reviews must have 1-400 entries")
            reviews = {}
            for k, v in rv.items():
                if not isinstance(k, str) or not SKILL_ID_RE.match(k) or not isinstance(v, dict):
                    raise Invalid("bad review entry")
                name = v.get("name", "")
                if not isinstance(name, str) or len(name) > 64:
                    raise Invalid("bad skill name")
                e = {"name": name}
                for field, allowed in (("status", STATUSES), ("kind", KINDS), ("mode", MODES)):
                    val = v.get(field, "")
                    if not isinstance(val, str) or val not in allowed:
                        raise Invalid("bad " + field)
                    e[field] = val
                note = v.get("note", "")
                if not isinstance(note, str):
                    raise Invalid("bad note")
                e["note"] = re.sub(r"[\x00-\x09\x0b-\x1f\x7f]", "", note)[:500]
                if e["status"] or e["kind"] or e["mode"] or e["note"]:
                    reviews[k] = e
            if not reviews:
                raise Invalid("nothing to store")
            out["count"] = len(reviews)
            out["reviews"] = reviews
            return out


        def _fb_prune(now):
            cutoff = now - FEEDBACK_TTL_DAYS * 86400
            feedback[:] = [(c, i) for c, i in feedback if i["received_t"] >= cutoff]


        class Handler(BaseHTTPRequestHandler):
            server_version = "party-relay/1"

            def log_message(self, fmt, *args):      # quiet: no per-request lines (no names in logs)
                pass

            def _send(self, code, obj):
                body = json.dumps(obj).encode()
                self.send_response(code)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def _code(self):
                m = re.match(r"^/v1/party/([^/?]+)$$", self.path)
                if not m:
                    return None
                code = m.group(1)
                if not CODE_RE.match(code) or (ALLOWED and code not in ALLOWED):
                    return False
                return code

            def _challenge(self, method):
                m = re.match(r"^/v1/challenge/([^/?]+)(?:/([0-9a-f]{8}))?$$", self.path)
                if not m:
                    return self._send(404, {"error": "not found"})
                code, cid = m.groups()
                if not CODE_RE.match(code) or (ALLOWED and code not in ALLOWED):
                    return self._send(403, {"error": "unknown party code"})
                d = {}
                if method == "POST":
                    raw = self._body(MAX_BODY)
                    if raw is None:
                        return self._send(413, {"error": "body too large or empty"})
                    try:
                        d = json.loads(raw)
                    except ValueError:
                        return self._send(400, {"error": "bad json"})
                    name = d.get("name") if isinstance(d, dict) else None
                    if not isinstance(name, str) or not NAME_RE.match(name):
                        return self._send(400, {"error": "bad name"})
                now = time.time()
                with lock:
                    try:
                        if method == "GET":
                            c = _ch_tick(code, now).get(cid) if cid else None
                            if c is None:
                                return self._send(404, {"error": "no such challenge"})
                        elif cid is None:
                            c = _ch_create(code, name, d, now)
                        else:
                            c = _ch_act(code, name, cid, d, now)
                    except ChError as e:
                        return self._send(e.code, {"error": e.msg})
                    return self._send(200, {**_ch_view(c, now), "server_t": now})

            def do_GET(self):
                if self.path.startswith("/v1/challenge/"):
                    if not _rate_ok(self.client_address[0]):
                        return self._send(429, {"error": "slow down"})
                    return self._challenge("GET")
                if self.path == "/health":
                    return self._send(200, {"ok": True, "source": SOURCE_URL, "feedback": bool(FEEDBACK_KEY)})
                if not _rate_ok(self.client_address[0]):
                    return self._send(429, {"error": "slow down"})
                if self.path.startswith("/v1/feedback"):
                    return self._feedback("GET")
                code = self._code()
                if code is None:
                    return self._send(404, {"error": "not found"})
                if code is False:
                    return self._send(403, {"error": "unknown party code"})
                with lock:
                    return self._send(200, {"members": _members(code, time.time()),
                                            "server_t": time.time()})

            def do_POST(self):
                if not _rate_ok(self.client_address[0]):
                    return self._send(429, {"error": "slow down"})
                if self.path.startswith("/v1/challenge/"):
                    return self._challenge("POST")
                if self.path.startswith("/v1/feedback"):
                    return self._feedback("POST")
                code = self._code()
                if code is None:
                    return self._send(404, {"error": "not found"})
                if code is False:
                    return self._send(403, {"error": "unknown party code"})
                n = int(self.headers.get("Content-Length") or 0)
                if n <= 0 or n > MAX_BODY:
                    return self._send(413, {"error": "body too large or empty"})
                try:
                    d = json.loads(self.rfile.read(n))
                except ValueError:
                    return self._send(400, {"error": "bad json"})
                name = d.get("name") if isinstance(d, dict) else None
                if not isinstance(name, str) or not NAME_RE.match(name):
                    return self._send(400, {"error": "bad name"})
                fields = {k: v for k, v in d.items() if k in FIELDS and FIELDS[k](v)}
                now = time.time()
                with lock:
                    if code not in parties and len(parties) >= MAX_CODES:
                        return self._send(503, {"error": "server full"})
                    p = parties.setdefault(code, {})
                    if MAX_MEMBERS and name not in p and len(p) >= MAX_MEMBERS:
                        oldest = min(p, key=lambda k: p[k][0])
                        del p[oldest]
                    p[name] = (now, fields)
                    ch = d.get("ch")
                    if isinstance(ch, dict) and isinstance(ch.get("id"), str):
                        c = (challenges.get(code) or {}).get(ch["id"])
                        if c is not None:
                            _ch_kills(c, name, ch.get("kills"), now)
                    return self._send(200, {"members": _members(code, now), "server_t": now,
                                            "challenges": _ch_for(code, name, now)})


            def do_DELETE(self):
                if not _rate_ok(self.client_address[0]):
                    return self._send(429, {"error": "slow down"})
                if self.path.startswith("/v1/feedback"):
                    return self._feedback("DELETE")
                return self._send(404, {"error": "not found"})

            def _body(self, limit):
                """Read the body: bytes, or None when empty/too big (the caller answers 413)."""
                try:
                    n = int(self.headers.get("Content-Length") or 0)
                except ValueError:
                    return None
                if n <= 0 or n > limit:
                    return None
                return self.rfile.read(n)

            def _feedback(self, method):
                if not FEEDBACK_KEY:
                    return self._send(404, {"error": "not found"})
                m = re.match(r"^/v1/feedback/([^/?]+)$$", self.path)
                if not m:
                    return self._send(404, {"error": "not found"})
                code = m.group(1)
                if not CODE_RE.match(code) or (FEEDBACK_CODES and code not in FEEDBACK_CODES):
                    return self._send(403, {"error": "unknown feedback code"})
                addr = self.client_address[0]
                if method != "POST":
                    key = self.headers.get("X-Feedback-Key") or ""
                    if not hmac.compare_digest(key.encode(), FEEDBACK_KEY.encode()):
                        return self._send(403, {"error": "bad key"})
                if method == "POST":
                    now = time.time()
                    if now - fb_last.get(addr, -1e12) < FEEDBACK_GAP_S:
                        return self._send(429, {"error": "one send per 30 s"})
                    raw = self._body(FEEDBACK_MAX_BODY)
                    if raw is None:
                        return self._send(413, {"error": "body too large or empty"})
                    try:
                        item = _clean_submission(json.loads(raw))
                    except ValueError:
                        return self._send(400, {"error": "bad json"})
                    except Invalid as e:
                        return self._send(400, {"error": str(e)})
                    item["id"] = secrets.token_hex(6)
                    item["received_t"] = now
                    with lock:
                        _fb_prune(now)
                        feedback.append((code, item))
                        del feedback[:max(0, len(feedback) - FEEDBACK_MAX)]
                        if len(fb_last) > 5000:
                            fb_last.clear()
                        fb_last[addr] = now
                    return self._send(200, {"ok": True, "id": item["id"]})
                if method == "GET":
                    with lock:
                        now = time.time()
                        _fb_prune(now)
                        items = [i for c, i in feedback if c == code]
                    return self._send(200, {"items": items, "server_t": now})
                # DELETE
                ids = None
                raw = self._body(FEEDBACK_MAX_BODY)
                if raw is not None:
                    try:
                        d = json.loads(raw)
                    except ValueError:
                        return self._send(400, {"error": "bad json"})
                    if isinstance(d, dict) and d.get("ids") is not None:
                        if not isinstance(d["ids"], list) or not all(isinstance(x, str) for x in d["ids"]):
                            return self._send(400, {"error": "ids must be a list of strings"})
                        ids = set(d["ids"])
                with lock:
                    _fb_prune(time.time())
                    keep = [(c, i) for c, i in feedback
                            if not (c == code and (ids is None or i["id"] in ids))]
                    deleted = len(feedback) - len(keep)
                    feedback[:] = keep
                return self._send(200, {"deleted": deleted})


        def main():
            port = int(os.environ.get("PORT", "8787"))
            bind = os.environ.get("BIND", "0.0.0.0")
            srv = ThreadingHTTPServer((bind, port), Handler)
            print(f"party relay on {bind}:{port}"
                  + (f", {len(ALLOWED)} allowed code(s)" if ALLOWED else ", any party code"), flush=True)
            try:
                srv.serve_forever()
            except KeyboardInterrupt:
                pass


        if __name__ == "__main__":
            main()
